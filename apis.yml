image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/remerge.png
name: Remerge
description: >-
  Remerge is a mobile demand-side platform (DSP) specializing in app retargeting,
  re-engagement, and user acquisition for mobile apps. The Berlin-based company
  (Remerge GmbH) helps advertisers in gaming, e-commerce, and delivery build
  in-app audience segments, run programmatic re-engagement and acquisition
  campaigns across millions of ad placements, and validate results with
  incrementality measurement. Onboarding is account-managed rather than
  self-service, but Remerge does publish two documented HTTP APIs: a JSON
  Reporting API at api.remerge.io for pulling daily campaign performance into a
  client's BI stack, and an Event Tracking API at remerge.events for forwarding
  in-app event, attribution, BI and SKAdNetwork data into Remerge. It operates
  an ISO/IEC 27001:2022-aligned ISMS and publishes a public Trust Center and
  vulnerability disclosure policy.
