name: Remerge
description: >-
  Remerge is a mobile demand-side platform (DSP) specializing in app retargeting,
  re-engagement, and user acquisition for mobile apps. The Berlin-based company
  (Remerge GmbH) helps advertisers in gaming, e-commerce, and delivery build
  in-app audience segments, run programmatic re-engagement and acquisition
  campaigns across millions of ad placements, and validate results with
  incrementality measurement. Remerge is a managed advertising service run
  through its platform and account teams rather than a public developer API;
  this profile captures its identity, security posture, and legal surface. It
  operates an ISO/IEC 27001:2022-aligned ISMS and publishes a public Trust
  Center and vulnerability disclosure policy.
