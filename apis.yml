apis:
- aid: remerge-reporting-api
  name: Remerge Reporting API
  description: >-
    JSON reporting API that lets Remerge advertisers pull daily (or hourly)
    campaign performance for their active campaigns into their own BI systems.
    A POST to /report with a start_date and end_date returns a results array
    aggregated across up to seven dimensions (audience, country, campaign,
    campaign_type, ad, ad_label, platform) with impressions, clicks, cost,
    conversions, attributed conversions, app-open rate and unique users.
    Authorization is a token obtained from a sign-in request against the same
    host using dashboard credentials. Remerge retains reportable data for six
    months only.
  humanURL: https://help.remerge.io/hc/en-us/articles/115003440434-Remerge-Reporting-API
