- aid: remerge-event-tracking-api
  name: Remerge Event Tracking API
  description: >-
    Server-to-server ingestion API that Remerge clients and measurement partners
    use to forward data into the Remerge platform. A single GET endpoint at
    remerge.events/event accepts four documented payload families: in-app event
    data, attribution data (with is_attributed, click_id, campaign and rejection
    reasons), BI data flagged with non_app_event=true, and SKAdNetwork installs
    with decoded conversion values. Requests are authorized with a partner name
    and a Remerge-issued key passed as query parameters, and the endpoint
    answers HTTP 204 by default.
  humanURL: https://help.remerge.io/hc/en-us/articles/6078711583260-Event-Data-Forwarding
